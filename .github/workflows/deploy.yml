# main ブランチへの push 時に Cloud Run へデプロイする
# 流れ: lint/knip → 認証 → Vite build（API URL 埋込）→ Artifact Registry push → Cloud Run デプロイ
name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  # --- lint / knip（デプロイ前ゲート） ---
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run knip
        run: npm run knip

  build-and-deploy:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      # リポジトリのソースを runner に取得
      - name: Checkout
        uses: actions/checkout@v5

      # --- GCP 認証・CLI セットアップ ---
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      # --- Docker イメージ build / push ---
      # VITE_* はビルド時に JS へ焼き込まれる（実行時の env では変更不可）
      - name: Build and Push Docker image
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/frontend/react-rails:latest
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
            --build-arg VITE_BASE_URL="${VITE_BASE_URL:-/}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      # --- Cloud Run Service デプロイ ---
      # 静的 nginx（SPA）。VPC / Secret Manager は不要
      - name: Deploy to Cloud Run
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/frontend/react-rails:latest
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy react-rails \
            --image="$IMAGE" \
            --region=asia-northeast1 \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --project="$GCP_PROJECT_ID"
