# main ブランチへの push 時に Firebase Hosting へデプロイする
# 流れ: lint/knip → npm ci → Vite build（API URL 埋込）→ firebase deploy --only hosting
name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  # --- lint / knip（デプロイ前ゲート） ---
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run knip
        run: npm run knip

  build-and-deploy:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # VITE_* はビルド時に JS へ焼き込まれる（実行時の env では変更不可）
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
        run: |
          export VITE_BASE_URL="${VITE_BASE_URL:-/}"
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --non-interactive
